[build]
  command = "npm run build"
  publish = "dist"

# SPA: все маршруты отдаём через index.html, кроме существующих файлов
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
