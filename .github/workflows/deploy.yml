name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages читает метаданные загруженного артефакта через Actions API:
  # без этого права шаг падает с «No artifacts named github-pages were found»
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      # Ошибка в supabase/schema.sql откатывает весь скрипт в SQL Editor,
      # поэтому ловим её до деплоя: схема проверяется на парность
      # долларовых кавычек и завершённость операторов
      - name: Check schema
        run: npm run check:schema

      - name: Set environment
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production

      # Chrome нужен скрипту пререндера, чтобы отрисовать страницы в HTML
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Build
        run: npm run build

      # Готовые HTML для всех адресов из sitemap.xml: GitHub Pages иначе отдаёт
      # глубокие ссылки с кодом 404, и поисковики считают их несуществующими
      - name: Prerender routes
        run: npm run prerender
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # CNAME для кастомного домена
      - name: Write CNAME
        run: echo 'vtoroe-dyhanie.ru' > dist/CNAME

      # deploy-pages@v5 сам находит артефакт github-pages, созданный
      # upload-pages-artifact@v5 в том же workflow run.
      #
      # Артефакт загружается раньше, чем GitHub успевает проиндексировать
      # его метаданные: первый вызов deploy-pages регулярно падает с
      # «No artifacts named github-pages were found». Поэтому пробуем трижды.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Deploy retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy retry 2
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Fail if deploy never succeeded
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: exit 1